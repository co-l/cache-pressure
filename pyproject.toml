[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cache-pressure"
version = "0.5.1"
description = "KV-cache retention pressure benchmark for OpenAI-compatible endpoints"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Conrad" }]
keywords = ["llm", "kv-cache", "benchmark", "prefix-cache", "openai"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Benchmark",
]
dependencies = ["requests>=2.31"]

[project.scripts]
cache-pressure = "cache_pressure.core:main"
needle-test = "cache_pressure.needle:main"
agent-sim = "cache_pressure.agent_sim:main"
abort-sim = "cache_pressure.abort_sim:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cache_pressure"]
